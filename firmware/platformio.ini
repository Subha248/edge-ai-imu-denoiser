[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_flags =
    -Isrc
    -Isrc/edge-impulse-sdk
    -Isrc/model-parameters
    -Isrc/tflite-model

build_flags =
    -Isrc
    -Isrc/edge-impulse-sdk
    -Isrc/model-parameters
    -Isrc/tflite-model
    -w

lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
